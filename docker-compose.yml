networks:
  360scalp-v2-net:
    driver: bridge

volumes:
  360scalp-v2-logs:
  360scalp-v2-data:
  360scalp-v2-redis:
  # Shared volume for the signing-service Unix socket (PR-4 + #444
  # wiring).  Engine main process connects to /app/sock/signing.sock
  # via this volume; the signing_service container is the only writer
  # — mode 0660 on the socket so only the engine user can read.
  # See OWNER_BRIEF §3.9 + B18 for the custody-boundary doctrine.
  #
  # Mount path is ``/app/sock`` rather than ``/var/run/lumin`` /
  # ``/run/lumin-signing``.  Tried both ``/var/run/`` (PR #448) and
  # ``/run/`` (PR #449) — Docker on Ubuntu 24.04 + the default
  # AppArmor profile (docker-default) restricts socket ``bind(2)``
  # under both tmpfs paths even for root.  ``/app/sock`` is plain
  # ext4 inside the container's writable layer + the named volume
  # — AppArmor permits bind there.  See PR #450 ship notes.
  360scalp-v2-signing-socket:

services:
  redis:
    image: redis:7.4-alpine
    container_name: 360scalp-v2-redis
    restart: always
    networks:
      - 360scalp-v2-net
    volumes:
      - 360scalp-v2-redis:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    # Self-healing layer 1 (docs/AUTONOMOUS_OPS.md): a health status so the
    # autoheal sidecar can restart a wedged-but-running redis. restart:always
    # only covers crashes; unhealthy containers otherwise just sit there.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Capped 2026-07-27: this container previously ran with no memory limit
    # at all. Redis self-limits its *dataset* to 128 MB via --maxmemory, but
    # that is not a container bound — fragmentation and the copy-on-write
    # fork during a background save both live outside it. An unbounded
    # container that leaks can exhaust the host and take the engine down
    # with it; the engine's own cap does not protect it from that direction.
    # 256m is ~37x measured usage (6.9 MB) and 2x the redis dataset ceiling.
    mem_limit: 256m
    cpus: "0.5"
    labels:
      - autoheal=true

  engine:
    build: .
    container_name: 360scalp-v2-engine
    env_file: .env
    restart: always
    depends_on:
      - redis
    networks:
      - 360scalp-v2-net
    volumes:
      - 360scalp-v2-logs:/app/logs
      - 360scalp-v2-data:/app/data
      # Shared with signing_service for the Unix socket.
      - 360scalp-v2-signing-socket:/app/sock
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MPLCONFIGDIR=/tmp/matplotlib
      # Path the engine's SigningClient connects to.  Must match
      # the signing_service container's bind path.
      - SIGNING_SERVICE_SOCKET_PATH=/app/sock/signing.sock
      # Phase A pre-TP grab — enabled in production after PR #281 ship.
      # Fires only on signals matching all gates (regime allowlist,
      # setup blacklist, age window, threshold).  See OWNER_BRIEF B11.
      - PRE_TP_ENABLED=true
      # API_ENABLED controls whether the engine wires up user-store /
      # Firebase / OTP deps.  In isolated mode these are also needed by
      # the engine (e.g. tripwires resolve firebase_uid → user_id), so
      # keep API_ENABLED=true even when API_PROCESS_ISOLATED=true.
      - API_ENABLED=${API_ENABLED:-false}
      # When true the engine publishes state to Redis (SnapshotWriter) but
      # does NOT run the HTTP server — that is the 'api' service below.
      - API_PROCESS_ISOLATED=${API_PROCESS_ISOLATED:-false}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
    # Resource caps raised 2026-07-27 after measuring the box (see
    # docs/UNIVERSE_EXPANSION_AND_SECOND_IP_2026_07_27.md §1b).
    #
    # The host is 4 cores / 7.8 GB running at ~25% load. We had the engine
    # capped at 1.5 cores and it was measured at 130% CPU — 87% of its own
    # allowance — while scanning 75 pairs, with ~3 host cores sitting idle
    # behind the cap. Mover promotion already takes the scan set to 105
    # pairs during an active market, so the engine was very likely being
    # throttled at candle boundaries: exactly when every timeframe
    # recomputes and exactly when the market is worth scanning.
    #
    # Memory was never the constraint: measured 459 MB against the old 1 GB
    # cap, zero OOM kills over the container's lifetime. Raised to 3g anyway
    # so RAM stays out of the way as the scan set grows (the RAM-derived
    # ceiling moves past 600 pairs), not because it was under pressure.
    #
    # Budget check against the 4-core host: engine 3.2 + api 0.5 + signing
    # 0.5 + autoheal 0.1 + watchdog 0.2 = 4.5 of 4. These are ceilings, not
    # reservations. The signing service keeps its own separate 0.5-core cap, so
    # the order path can never be starved by a busy scanner — the only part of
    # this that touches safety.
    #
    # Raised 2.5 -> 3.2 on 2026-08-19. Measured on the live box: the engine sat
    # at 182-263% of its 2.5-core cap (bursting to 394%) while the HOST load
    # averaged 2.3-3.2 of 4 — i.e. ~1.4 cores were idle *behind the cap*, and
    # scan cycles were running 38-402s against a 15s target. That is capacity
    # already paid for and not used.
    #
    # It is a mitigation, not the fix, and the number is deliberately modest.
    # The engine is one Python process: indicator compute and JSON persistence
    # hold the GIL, so past ~1 core of that work extra cores buy nothing. The
    # cure for the cycle time is in the code (deferred edge-store writes,
    # vectorised indicators); this just stops the cgroup throttling the loop
    # while the box has room. SCAN_EXECUTOR_WORKERS reads this quota directly
    # via config.cpu_budget(), so raising it here raises the thread pool too.
    mem_limit: 3g
    cpus: "3.2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      # Longer than V1 — V2 needs time to seed 50 pairs × 5 timeframes
      start_period: 60s
      retries: 3
    # The engine healthcheck tests WORK (scanner heartbeat freshness), not
    # just process-up — a wedged scan loop flips the container unhealthy and
    # the autoheal sidecar restarts it. Safe by design: the engine boots
    # fail-closed (auto-trade disabled until the Firestore flag says
    # otherwise) and every open position's SL/TP rests on Binance, so a
    # restart is always risk-reducing (docs/AUTONOMOUS_OPS.md).
    labels:
      - autoheal=true

  # ── Isolated API container ─────────────────────────────────────────────
  # Active when API_PROCESS_ISOLATED=true.  Reads pre-computed snapshots
  # from Redis (written by SnapshotWriter in the engine container) and
  # serves HTTP on API_PORT.  Shares the data volume (SQLite user/override
  # DB) and the logs volume with the engine.
  #
  # To enable: set API_PROCESS_ISOLATED=true in .env (and API_ENABLED=true).
  # nginx reverse-proxy target stays the same (127.0.0.1:${API_PORT}).
  api:
    build: .
    container_name: 360scalp-v2-api
    command: python -m src.api.main
    env_file: .env
    restart: always
    depends_on:
      - redis
      - engine
    networks:
      - 360scalp-v2-net
    volumes:
      - 360scalp-v2-logs:/app/logs
      # Shared SQLite (user store, user overrides, trade records).
      - 360scalp-v2-data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MPLCONFIGDIR=/tmp/matplotlib
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
    # Published to host loopback so nginx proxies it; WAN can't reach directly.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Deep healthcheck: an actual HTTP round-trip against /api/health (rate-
    # limit exempt), not a process probe — catches a hung event loop, which
    # is exactly the failure the isolated-API split exists to contain. The
    # Dockerfile's default HEALTHCHECK tests the SCANNER heartbeat, which
    # never exists in this container — without this override the api would
    # sit permanently unhealthy and autoheal would restart-loop it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('API_PORT','8000')+'/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    profiles:
      # Only started when docker compose --profile isolated up is used,
      # or when API_PROCESS_ISOLATED=true is set and compose profiles are
      # managed via deploy.sh.  Prevents accidental double-binding of
      # API_PORT in single-process deployments.
      - isolated

  signing_service:
    # Separate process boundary for the Binance-key signing chain
    # (OWNER_BRIEF §3.9 + B18 — the Lumin equivalent of 3Commas'
    # post-breach Sign Center pattern).  Same image as the engine
    # (re-uses the requirements + src layout) but runs only
    # ``python -m src.security.signing_service`` — no scanner, no
    # router, no API.  Plaintext API secrets materialise ONLY
    # inside this container's process memory; the engine container
    # has no GCP KMS access path of its own (it talks to this
    # container via the Unix socket).
    build: .
    container_name: 360scalp-v2-signing
    env_file: .env
    restart: always
    # Run as root inside the container so it can bind the Unix
    # socket on the named volume.  The Dockerfile's USER directive
    # makes the default user ``appuser``, but Docker named volumes
    # mount as root:root with mode 0755 — appuser can't write +
    # bind() fails with EACCES.  Override to root here; the
    # socket gets chmod 0666 (see server.py) so the engine's
    # appuser can still connect.  The security boundary is the
    # container, not the Linux user (per OWNER_BRIEF §3.9 — the
    # signing service's isolation comes from its separate process /
    # KMS IAM, not from running as a different Linux user).
    user: "0:0"
    networks:
      - 360scalp-v2-net
    volumes:
      # Mount the same /app/data as the engine so the
      # firebase-service-account.json is reachable at the same path
      # the env var points to.
      - 360scalp-v2-data:/app/data
      # The Unix socket the engine connects to.  This container is
      # the listener; the engine is the client.
      - 360scalp-v2-signing-socket:/app/sock
    environment:
      # Override the default path so the socket lands on the
      # shared volume rather than the container's own /var/run/.
      - SIGNING_SERVICE_SOCKET_PATH=/app/sock/signing.sock
    command: python -m src.security.signing_service
    # Override the Dockerfile's engine healthcheck (which checks for the
    # scanner heartbeat file and src.main process — neither exist here).
    # The socket is created AFTER KMS + Firestore init, so its presence is
    # a reliable "fully ready" probe with no false positives on stale files
    # (server.py unlinks any stale socket at startup before re-binding).
    healthcheck:
      test: ["CMD-SHELL", "test -S /app/sock/signing.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Self-healing layer 2: autoheal (docs/AUTONOMOUS_OPS.md) ────────────
  # Docker deliberately does NOT restart unhealthy containers —
  # restart:always only covers exits. This sidecar watches health status
  # and restarts any container labeled autoheal=true, turning the deep
  # healthchecks above into automatic recovery from wedges, not just
  # crashes. Standard tool (willfarrell/docker-autoheal), version-pinned.
  # network_mode:none — it only ever talks to the local Docker socket.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: 360scalp-v2-autoheal
    restart: always
    network_mode: none
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      # Matches the watchdog's restart grace — the engine flushes state
      # files + closes WS cleanly within 30s.
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m
    cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── Self-healing layer 3: watchdog (docs/AUTONOMOUS_OPS.md) ────────────
  # Minutes-level supervisor for the invariants a container healthcheck
  # can't express: blind open positions (audit F-07), wedged monitor loop,
  # breaker trips, disk/memory pressure. Pages the owner on Telegram,
  # restarts the engine on confirmed wedges (bounded budget), engages the
  # kill switch when the engine is unrecoverable, pings the external
  # dead-man's switch. Risk-reducing actions ONLY — it has no code path
  # that re-enables trading.
  #
  # Root + docker.sock: required to inspect/restart sibling containers —
  # same standing as autoheal above and the ops diag runner (owner-only
  # box). NOT autoheal-labeled and no self-restart path: one supervisor
  # must stay outside the blast radius of the machinery it supervises;
  # restart:always covers its crashes.
  watchdog:
    build: .
    container_name: 360scalp-v2-watchdog
    command: python scripts/watchdog.py
    env_file: .env
    restart: always
    user: "0:0"
    networks:
      - 360scalp-v2-net
    volumes:
      - 360scalp-v2-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - API_PORT=${API_PORT:-8000}
      - API_PROCESS_ISOLATED=${API_PROCESS_ISOLATED:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; p='/tmp/watchdog_heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 128m
    cpus: "0.2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
