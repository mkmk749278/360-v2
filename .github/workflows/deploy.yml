name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'OWNER_BRIEF.md'
      - 'BRIEF_INTEGRITY.md'
      - 'ACTIVE_CONTEXT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          request_pty: true
          script: |
            set -euo pipefail

            # Mask the PAT so it never appears in plain text in workflow logs.
            # NOTE: GH_PAT must be added as a repo secret (Settings → Secrets →
            # Actions → New secret, name: GH_PAT, value: a GitHub PAT with repo scope).
            echo "::add-mask::${{ secrets.GH_PAT }}"

            # ── Bootstrap: re-authorize deploy key (survives OS reinstall) ──────
            DEPLOY_PUBKEY="${{ secrets.VPS_DEPLOY_PUBKEY }}"
            if [ -n "$DEPLOY_PUBKEY" ]; then
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh
              touch ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/authorized_keys
              if ! grep -qF "$DEPLOY_PUBKEY" ~/.ssh/authorized_keys; then
                echo "$DEPLOY_PUBKEY" >> ~/.ssh/authorized_keys
                echo "ℹ️  Deploy key re-authorized"
              fi
            fi

            # ── Bootstrap: clone repo if missing (fresh VPS / OS reinstall) ─────
            if [ ! -d ~/360-v2/.git ]; then
              echo "ℹ️  Fresh VPS detected — cloning repository..."
              git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/mkmk749278/360-v2.git ~/360-v2
            fi

            cd ~/360-v2

            # Update remote to use token auth (handles existing clones that lost
            # credentials when the repo switched to private)
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/mkmk749278/360-v2.git

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # ── Bootstrap: install Docker if missing (fresh VPS / OS reinstall) ──
            if ! command -v docker &>/dev/null; then
              echo "ℹ️  Docker not found — installing..."
              apt-get update -qq
              apt-get install -y -qq ca-certificates curl gnupg
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
              echo "✅ Docker installed"
            fi

            # Ensure Docker daemon is running
            if ! systemctl is-active --quiet docker; then
              systemctl start docker
            fi

            # Bootstrap .env from template only when it does not already exist
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "ℹ️  Created .env from .env.example"
            fi

            # ── Inject/update all secrets in place ──────────────────────────────

            # Telegram
            sed -i "s|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}|" .env
            sed -i "s|^TELEGRAM_ACTIVE_CHANNEL_ID=.*|TELEGRAM_ACTIVE_CHANNEL_ID=${{ secrets.TELEGRAM_ACTIVE_CHANNEL_ID }}|" .env
            sed -i "s|^TELEGRAM_FREE_CHANNEL_ID=.*|TELEGRAM_FREE_CHANNEL_ID=${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}|" .env
            sed -i "s|^TELEGRAM_ADMIN_CHAT_ID=.*|TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}|" .env

            # Binance API keys (update if line exists, append if not)
            grep -q "^BINANCE_API_KEY=" .env \
              && sed -i "s|^BINANCE_API_KEY=.*|BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}|" .env \
              || echo "BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}" >> .env

            grep -q "^BINANCE_API_SECRET=" .env \
              && sed -i "s|^BINANCE_API_SECRET=.*|BINANCE_API_SECRET=${{ secrets.BINANCE_API_SECRET }}|" .env \
              || echo "BINANCE_API_SECRET=${{ secrets.BINANCE_API_SECRET }}" >> .env

            # OpenAI API key (update if line exists, append if not)
            grep -q "^OPENAI_API_KEY=" .env \
              && sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}|" .env \
              || echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env

            # NOWPayments (web billing crypto rail — Phase 3).  These are the
            # engine-side secrets; GitHub secrets don't reach the engine unless
            # injected here (same pattern as Binance/OpenAI above).  Empty secret
            # → the crypto rail refuses at runtime with a clean 503, never a crash.
            grep -q "^NOWPAYMENTS_API_KEY=" .env \
              && sed -i "s|^NOWPAYMENTS_API_KEY=.*|NOWPAYMENTS_API_KEY=${{ secrets.NOWPAYMENTS_API_KEY }}|" .env \
              || echo "NOWPAYMENTS_API_KEY=${{ secrets.NOWPAYMENTS_API_KEY }}" >> .env

            grep -q "^NOWPAYMENTS_IPN_SECRET=" .env \
              && sed -i "s|^NOWPAYMENTS_IPN_SECRET=.*|NOWPAYMENTS_IPN_SECRET=${{ secrets.NOWPAYMENTS_IPN_SECRET }}|" .env \
              || echo "NOWPAYMENTS_IPN_SECRET=${{ secrets.NOWPAYMENTS_IPN_SECRET }}" >> .env

            # Gemini — the AI Trade Governor's provider (docs/PLAN_AI_TRADE_GOVERNOR.md).
            # Same pattern, and the same reason: a GitHub repository secret does
            # NOT reach the engine on its own.  The key was added to the repo's
            # secrets on 2026-09-03 and would have sat there doing nothing until
            # somebody noticed the ops page still reading NOT CONFIGURED.
            #
            # Empty secret is a supported state, not a failure: `llm_client`
            # returns `not_configured`, the governor makes no call, and the ops
            # page says so under its own name.
            grep -q "^GEMINI_API_KEY=" .env \
              && sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" .env \
              || echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

            # Slack packet poster (D1, docs/PLAN_AI_TRADE_GOVERNOR_V2.md §6.3).
            # Same pattern and the same reason as GEMINI_API_KEY above: a repo
            # secret does NOT reach the engine on its own, and that one sat in
            # the repo's secrets doing nothing until somebody noticed the ops
            # page still reading NOT CONFIGURED.
            #
            # The URL is a WRITE CAPABILITY on the channel — anyone holding it
            # can post as Lumin Engine — so it is masked here, and engine-side
            # `slack_packet._redact` strips it from the ops payload AND from
            # anything handed to `fail_open`, because aiohttp puts the dialled
            # URL into the string form of a connection error.
            #
            # Empty secret is a supported state, not a failure: the lane reads
            # `not_configured`, enqueues nothing, makes no call, and the ops
            # panel names which of the two halves is missing.
            #
            # NOTE the direction of authority: these lines make the GitHub
            # secret the source of truth, so a value edited by hand on the VPS
            # is overwritten on the next deploy. That is deliberate — one
            # writer — but it means "I set it on the box and it vanished" is
            # expected behaviour rather than a bug.
            echo "::add-mask::${{ secrets.SLACK_PACKET_WEBHOOK_URL }}"

            grep -q "^SLACK_PACKET_WEBHOOK_URL=" .env \
              && sed -i "s|^SLACK_PACKET_WEBHOOK_URL=.*|SLACK_PACKET_WEBHOOK_URL=${{ secrets.SLACK_PACKET_WEBHOOK_URL }}|" .env \
              || echo "SLACK_PACKET_WEBHOOK_URL=${{ secrets.SLACK_PACKET_WEBHOOK_URL }}" >> .env

            grep -q "^SLACK_PACKET_CHANNEL_ID=" .env \
              && sed -i "s|^SLACK_PACKET_CHANNEL_ID=.*|SLACK_PACKET_CHANNEL_ID=${{ secrets.SLACK_PACKET_CHANNEL_ID }}|" .env \
              || echo "SLACK_PACKET_CHANNEL_ID=${{ secrets.SLACK_PACKET_CHANNEL_ID }}" >> .env

            # ── Rebuild and restart all containers ───────────────────────────
            # deploy.sh reads API_PROCESS_ISOLATED from .env and selects the
            # correct compose files / profile automatically (isolated mode adds
            # --profile isolated so the 'api' container is included; single-process
            # mode adds -f docker-compose.singleprocess.yml for the engine port
            # binding).  Running bare 'docker compose up' bypasses that logic and
            # leaves the 'api' container on a stale image in isolated mode.
            bash deploy.sh

            echo "✅ Deploy complete"
