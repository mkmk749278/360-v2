name: CI

# Pre-merge gate for pull requests. The repo's only other workflow,
# deploy.yml, runs on push to main and ships to live subscribers in ~45s —
# so the test/lint gate has to live on the PR, before the merge, not after.
on:
  pull_request:
    branches: [main]
  # Allow manual runs for debugging the workflow itself.
  workflow_dispatch:

# Cancel superseded runs on the same PR so a force-push doesn't pile up jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov pytest-timeout

      # Blocking gate: src/ + config/ are ruff-clean as of this PR, so lint
      # failures now fail CI. Keep new code clean to keep this green.
      - name: Lint (ruff)
        run: ruff check src/ config/

      # Blocking gate. Mirrors the local command in CLAUDE.md.
      # Coverage is measured and REPORTED, not gated (2026-07-17): the
      # per-module table in the job summary makes untested modules visible
      # at review time without turning a coverage dip into a red build.
      #
      # 2026-09-26 test-suite audit:
      # * no ``-x`` — stopping at the first failure hid every other one, so a
      #   red run said "one thing broke" when it could have said "these five";
      # * ``test_deployment.py`` is no longer ignored — it passes, and nothing
      #   recorded why it had been excluded;
      # * ``--timeout`` turns a hung async test into a NAMED failure instead of
      #   a silent 20-minute job cancellation.
      - name: Tests (pytest)
        run: >
          python -m pytest tests/ -q --timeout=300
          --cov=src --cov=config --cov-report=term

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo '## Test coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --sort=cover --skip-covered >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
