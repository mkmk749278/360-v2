[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "360-crypto-scalping-v2"
version = "2.0.0"
description = "360-Crypto-Eye-Scalping V2 – AI-powered crypto signal engine"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Strict xfail (2026-07-14): non-strict markers let 5 rotted tests hide for
# weeks under blanket "expected to fail" labels while 28 healthy tests gave
# no signal.  An xfail that passes is now a FAILURE — markers must be
# removed the moment their premise dies.
xfail_strict = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules are re-export hubs — e.g. src/scanner_core.py does
# `from src.scanner import *`, so names imported in src/scanner/__init__.py are
# part of the public surface even when unused inside the file itself. F401
# (unused-import) is conventionally ignored for __init__.py for this reason.
"__init__.py" = ["F401", "E402"]
