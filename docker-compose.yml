networks:
  360scalp-v2-net:
    driver: bridge

volumes:
  360scalp-v2-logs:
  360scalp-v2-data:
  360scalp-v2-redis:
  # Shared volume for the signing-service Unix socket (PR-4 + #444
  # wiring).  Engine main process connects to /app/sock/signing.sock
  # via this volume; the signing_service container is the only writer
  # — mode 0660 on the socket so only the engine user can read.
  # See OWNER_BRIEF §3.9 + B18 for the custody-boundary doctrine.
  #
  # Mount path is ``/app/sock`` rather than ``/var/run/lumin`` /
  # ``/run/lumin-signing``.  Tried both ``/var/run/`` (PR #448) and
  # ``/run/`` (PR #449) — Docker on Ubuntu 24.04 + the default
  # AppArmor profile (docker-default) restricts socket ``bind(2)``
  # under both tmpfs paths even for root.  ``/app/sock`` is plain
  # ext4 inside the container's writable layer + the named volume
  # — AppArmor permits bind there.  See PR #450 ship notes.
  360scalp-v2-signing-socket:

services:
  redis:
    image: redis:7.4-alpine
    container_name: 360scalp-v2-redis
    restart: always
    networks:
      - 360scalp-v2-net
    volumes:
      - 360scalp-v2-redis:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  engine:
    build: .
    container_name: 360scalp-v2-engine
    env_file: .env
    restart: always
    depends_on:
      - redis
    networks:
      - 360scalp-v2-net
    volumes:
      - 360scalp-v2-logs:/app/logs
      - 360scalp-v2-data:/app/data
      # Shared with signing_service for the Unix socket.
      - 360scalp-v2-signing-socket:/app/sock
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MPLCONFIGDIR=/tmp/matplotlib
      # Path the engine's SigningClient connects to.  Must match
      # the signing_service container's bind path.
      - SIGNING_SERVICE_SOCKET_PATH=/app/sock/signing.sock
      # Phase A pre-TP grab — enabled in production after PR #281 ship.
      # Fires only on signals matching all gates (regime allowlist,
      # setup blacklist, age window, threshold).  See OWNER_BRIEF B11.
      - PRE_TP_ENABLED=true
      # API_ENABLED controls whether the engine wires up user-store /
      # Firebase / OTP deps.  In isolated mode these are also needed by
      # the engine (e.g. tripwires resolve firebase_uid → user_id), so
      # keep API_ENABLED=true even when API_PROCESS_ISOLATED=true.
      - API_ENABLED=${API_ENABLED:-false}
      # When true the engine publishes state to Redis (SnapshotWriter) but
      # does NOT run the HTTP server — that is the 'api' service below.
      - API_PROCESS_ISOLATED=${API_PROCESS_ISOLATED:-false}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
    mem_limit: 1g
    cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      # Longer than V1 — V2 needs time to seed 50 pairs × 5 timeframes
      start_period: 60s
      retries: 3

  # ── Isolated API container ─────────────────────────────────────────────
  # Active when API_PROCESS_ISOLATED=true.  Reads pre-computed snapshots
  # from Redis (written by SnapshotWriter in the engine container) and
  # serves HTTP on API_PORT.  Shares the data volume (SQLite user/override
  # DB) and the logs volume with the engine.
  #
  # To enable: set API_PROCESS_ISOLATED=true in .env (and API_ENABLED=true).
  # nginx reverse-proxy target stays the same (127.0.0.1:${API_PORT}).
  api:
    build: .
    container_name: 360scalp-v2-api
    command: python -m src.api.main
    env_file: .env
    restart: always
    depends_on:
      - redis
      - engine
    networks:
      - 360scalp-v2-net
    volumes:
      - 360scalp-v2-logs:/app/logs
      # Shared SQLite (user store, user overrides, trade records).
      - 360scalp-v2-data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MPLCONFIGDIR=/tmp/matplotlib
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
    # Published to host loopback so nginx proxies it; WAN can't reach directly.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      # Only started when docker compose --profile isolated up is used,
      # or when API_PROCESS_ISOLATED=true is set and compose profiles are
      # managed via deploy.sh.  Prevents accidental double-binding of
      # API_PORT in single-process deployments.
      - isolated

  signing_service:
    # Separate process boundary for the Binance-key signing chain
    # (OWNER_BRIEF §3.9 + B18 — the Lumin equivalent of 3Commas'
    # post-breach Sign Center pattern).  Same image as the engine
    # (re-uses the requirements + src layout) but runs only
    # ``python -m src.security.signing_service`` — no scanner, no
    # router, no API.  Plaintext API secrets materialise ONLY
    # inside this container's process memory; the engine container
    # has no GCP KMS access path of its own (it talks to this
    # container via the Unix socket).
    build: .
    container_name: 360scalp-v2-signing
    env_file: .env
    restart: always
    # Run as root inside the container so it can bind the Unix
    # socket on the named volume.  The Dockerfile's USER directive
    # makes the default user ``appuser``, but Docker named volumes
    # mount as root:root with mode 0755 — appuser can't write +
    # bind() fails with EACCES.  Override to root here; the
    # socket gets chmod 0666 (see server.py) so the engine's
    # appuser can still connect.  The security boundary is the
    # container, not the Linux user (per OWNER_BRIEF §3.9 — the
    # signing service's isolation comes from its separate process /
    # KMS IAM, not from running as a different Linux user).
    user: "0:0"
    networks:
      - 360scalp-v2-net
    volumes:
      # Mount the same /app/data as the engine so the
      # firebase-service-account.json is reachable at the same path
      # the env var points to.
      - 360scalp-v2-data:/app/data
      # The Unix socket the engine connects to.  This container is
      # the listener; the engine is the client.
      - 360scalp-v2-signing-socket:/app/sock
    environment:
      # Override the default path so the socket lands on the
      # shared volume rather than the container's own /var/run/.
      - SIGNING_SERVICE_SOCKET_PATH=/app/sock/signing.sock
    command: python -m src.security.signing_service
    # Override the Dockerfile's engine healthcheck (which checks for the
    # scanner heartbeat file and src.main process — neither exist here).
    # The socket is created AFTER KMS + Firestore init, so its presence is
    # a reliable "fully ready" probe with no false positives on stale files
    # (server.py unlinks any stale socket at startup before re-binding).
    healthcheck:
      test: ["CMD-SHELL", "test -S /app/sock/signing.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
