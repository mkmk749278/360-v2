name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'OWNER_BRIEF.md'
      - 'BRIEF_INTEGRITY.md'
      - 'ACTIVE_CONTEXT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        # Every secret the remote script needs arrives as an ENVIRONMENT
        # VARIABLE, not interpolated into the script's text. Two reasons, and
        # neither is about log masking — GitHub already redacts registered
        # secrets from logs automatically, and `::add-mask::` only re-registers
        # the same exact string.
        #
        # 1. A value interpolated into shell SOURCE has to survive shell
        #    quoting. A secret containing a double quote would have broken the
        #    whole script; one containing `&` or `\` silently corrupted the
        #    `.env` line it was written to (see `put_env` below).
        # 2. The vendor's own caveat is that automatic redaction "is not
        #    guaranteed" once a value is transformed. A value that never enters
        #    the command text cannot be transformed by the command text.
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VPS_DEPLOY_PUBKEY: ${{ secrets.VPS_DEPLOY_PUBKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
          NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          request_pty: true
          envs: GH_PAT,VPS_DEPLOY_PUBKEY,TELEGRAM_BOT_TOKEN,TELEGRAM_ADMIN_CHAT_ID,BINANCE_API_KEY,BINANCE_API_SECRET,OPENAI_API_KEY,NOWPAYMENTS_API_KEY,NOWPAYMENTS_IPN_SECRET,GEMINI_API_KEY
          script: |
            set -euo pipefail

            # Mask the PAT so it never appears in plain text in workflow logs.
            # NOTE: GH_PAT must be added as a repo secret (Settings → Secrets →
            # Actions → New secret, name: GH_PAT, value: a GitHub PAT with repo scope).
            echo "::add-mask::$GH_PAT"

            # ── Bootstrap: re-authorize deploy key (survives OS reinstall) ──────
            DEPLOY_PUBKEY="$VPS_DEPLOY_PUBKEY"
            if [ -n "$DEPLOY_PUBKEY" ]; then
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh
              touch ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/authorized_keys
              if ! grep -qF "$DEPLOY_PUBKEY" ~/.ssh/authorized_keys; then
                echo "$DEPLOY_PUBKEY" >> ~/.ssh/authorized_keys
                echo "ℹ️  Deploy key re-authorized"
              fi
            fi

            # ── Bootstrap: clone repo if missing (fresh VPS / OS reinstall) ─────
            if [ ! -d ~/360-v2/.git ]; then
              echo "ℹ️  Fresh VPS detected — cloning repository..."
              git clone "https://x-access-token:${GH_PAT}@github.com/mkmk749278/360-v2.git" ~/360-v2
            fi

            cd ~/360-v2

            # Update remote to use token auth (handles existing clones that lost
            # credentials when the repo switched to private)
            git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/mkmk749278/360-v2.git"

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # ── Bootstrap: install Docker if missing (fresh VPS / OS reinstall) ──
            if ! command -v docker &>/dev/null; then
              echo "ℹ️  Docker not found — installing..."
              apt-get update -qq
              apt-get install -y -qq ca-certificates curl gnupg
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
              echo "✅ Docker installed"
            fi

            # Ensure Docker daemon is running
            if ! systemctl is-active --quiet docker; then
              systemctl start docker
            fi

            # Bootstrap .env from template only when it does not already exist
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "ℹ️  Created .env from .env.example"
            fi

            # ── Inject/update all secrets in place ──────────────────────────────
            #
            # `put_env KEY VALUE` replaces (or appends) one `.env` line, and the
            # VALUE never passes through a sed replacement.
            #
            # THE DEFECT THIS REPLACES, because it was silent and it was on the
            # credential path. Every key here was written with
            #
            #     sed -i "s|^KEY=.*|KEY=$VALUE|" .env
            #
            # and in a sed REPLACEMENT `&` expands to the whole match while `\`
            # escapes. Measured, not reasoned: a secret of `abc&def` landed in
            # `.env` as `abcBINANCE_API_SECRET=olddef`, and one containing a
            # backslash-n split the file into two lines with a bogus second
            # entry. Nothing errored, `set -e` never fired, the deploy printed
            # "✅ Deploy complete" — and the engine then could not authenticate,
            # with no instrument anywhere saying why. A value containing `|`
            # broke the expression outright, and one containing a double quote
            # broke the surrounding shell line.
            #
            # The sed below addresses only the KEY, which is a literal this
            # workflow controls, so no secret is ever parsed as sed syntax;
            # printf writes the value verbatim.
            #
            # Behaviour is otherwise UNCHANGED, deliberately. An empty secret
            # still writes `KEY=`, exactly as before: the comments on
            # NOWPAYMENTS ("empty → a clean 503") and GEMINI ("empty is a
            # supported state") say that is wanted, and nothing here can tell
            # which of the others the owner has set. Making a missing secret a
            # hard deploy failure would block every deploy if that guess were
            # wrong, which is worse than the fault it would catch.
            put_env() {
              key="$1"
              value="$2"
              touch .env
              sed -i "/^${key}=/d" .env
              printf '%s=%s\n' "$key" "$value" >> .env
            }

            # Telegram BOT — commands, admin alerts, the liveness pager, OTP.
            # The broadcast channels were deleted 2026-09-16 (#1037); these two
            # address the owner's own chat and are not channel ids.
            put_env TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
            put_env TELEGRAM_ADMIN_CHAT_ID "$TELEGRAM_ADMIN_CHAT_ID"

            # Binance — the engine's own account keys.
            put_env BINANCE_API_KEY "$BINANCE_API_KEY"
            put_env BINANCE_API_SECRET "$BINANCE_API_SECRET"

            put_env OPENAI_API_KEY "$OPENAI_API_KEY"

            # NOWPayments (web billing crypto rail — Phase 3). A GitHub secret
            # does not reach the engine unless injected here. Empty secret → the
            # crypto rail refuses at runtime with a clean 503, never a crash.
            put_env NOWPAYMENTS_API_KEY "$NOWPAYMENTS_API_KEY"
            put_env NOWPAYMENTS_IPN_SECRET "$NOWPAYMENTS_IPN_SECRET"

            # Gemini — the AI Trade Governor's provider
            # (docs/PLAN_AI_TRADE_GOVERNOR.md). Same reason: a repository secret
            # does NOT reach the engine on its own — this key sat in the repo's
            # secrets doing nothing until somebody noticed the ops page still
            # reading NOT CONFIGURED.
            #
            # Empty secret is a supported state, not a failure: `llm_client`
            # returns `not_configured`, the governor makes no call, and the ops
            # page says so under its own name.
            put_env GEMINI_API_KEY "$GEMINI_API_KEY"

            # Slack packet poster (D1) — REMOVED 2026-09-16. The owner moved
            # every surface to the app and ruled the lane out; `slack_packet.py`,
            # its config, its tunable and its two diag entries are gone.
            #
            # This purge line exists because deleting the injection is not the
            # same as cleaning the box: the last deploy already wrote
            # SLACK_PACKET_WEBHOOK_URL into the VPS `.env`, and that URL is a
            # write capability on the channel. Nothing reads it now, so it is a
            # dangling credential on disk rather than a live path — but a
            # credential no code reads is exactly the one nobody audits.
            #
            # It is idempotent and safe to keep. Drop it once a deploy has run
            # with it and the keys are confirmed absent from `.env` on the box.
            sed -i '/^SLACK_PACKET_/d' .env

            # Telegram BROADCAST CHANNEL ids — deleted 2026-09-16 with the
            # channels themselves. Same reasoning as the Slack purge above:
            # the last deploy wrote them into this .env, nothing reads them
            # now, and a value no code reads is the one nobody audits. The
            # BOT token and the ADMIN chat id are untouched — commands, the
            # liveness pager and OTP all still need them.
            sed -i '/^TELEGRAM_ACTIVE_CHANNEL_ID=/d;/^TELEGRAM_FREE_CHANNEL_ID=/d;/^TELEGRAM_SIGNALS_ENABLED=/d' .env

            # ── Rebuild and restart all containers ───────────────────────────
            # deploy.sh reads API_PROCESS_ISOLATED from .env and selects the
            # correct compose files / profile automatically (isolated mode adds
            # --profile isolated so the 'api' container is included; single-process
            # mode adds -f docker-compose.singleprocess.yml for the engine port
            # binding).  Running bare 'docker compose up' bypasses that logic and
            # leaves the 'api' container on a stale image in isolated mode.
            bash deploy.sh

            echo "✅ Deploy complete"
